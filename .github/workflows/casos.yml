name: Casos e análises — coleta por hashtag e termo (TikTok e Google grátis; Apify, contas dos outros pesquisadores, teto por caso)

# Termos, janela e tetos em data/config/casos.json. Publicações de qualquer pessoa: texto e contas só no repositório privado.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "teste (1 termo por rede, 10 itens) · carga · so-analises (sem coleta, sem custo)"
        type: choice
        options: [teste, carga, so-analises]
        default: teste
      caso:
        description: "id do caso (vazio = todos os ativos)"
        default: ""
      redes:
        description: "redes separadas por espaço (vazio = tiktok x instagram facebook kwai google)"
        default: ""

concurrency:
  group: casos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  casos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: |
          pip install -q networkx==3.6.1 numpy==2.3.4 playwright
          python -m playwright install --with-deps chromium > /dev/null 2>&1
      - name: Testes
        run: scripts/testes_ci.sh
      - name: Repositório privado
        id: interno
        env:
          TOKEN: ${{ secrets.ODI_INTERNO_TOKEN }}
        run: |
          if [ -n "$TOKEN" ] && git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/WandersonH/odi-atlas-interno.git" "$RUNNER_TEMP/interno"; then
            echo "dir=$RUNNER_TEMP/interno" >> "$GITHUB_OUTPUT"
          fi
      - name: Coletar (com teto por rede)
        if: github.event.inputs.modo != 'so-analises'
        continue-on-error: true
        env:
          APIFY_TOKEN_4: ${{ secrets.APIFY_TOKEN_4 }}
          APIFY_TOKEN_5: ${{ secrets.APIFY_TOKEN_5 }}
          APIFY_TOKEN_6: ${{ secrets.APIFY_TOKEN_6 }}
          APIFY_TOKEN_7: ${{ secrets.APIFY_TOKEN_7 }}
          APIFY_TOKEN_9: ${{ secrets.APIFY_TOKEN_9 }}
          APIFY_TOKEN_10: ${{ secrets.APIFY_TOKEN_10 }}
          APIFY_TOKEN_11: ${{ secrets.APIFY_TOKEN_11 }}
          APIFY_TOKEN_12: ${{ secrets.APIFY_TOKEN_12 }}
          APIFY_TOKEN_13: ${{ secrets.APIFY_TOKEN_13 }}
          APIFY_TOKEN_14: ${{ secrets.APIFY_TOKEN_14 }}
          APIFY_TOKEN_15: ${{ secrets.APIFY_TOKEN_15 }}
          ODI_INTERNO_DIR: ${{ steps.interno.outputs.dir }}
          MODO: ${{ github.event.inputs.modo }}
          CASO: ${{ github.event.inputs.caso }}
          REDES: ${{ github.event.inputs.redes }}
        run: |
          a=""
          if [ "$MODO" = "teste" ]; then a="--teste"; fi
          if [ -n "$CASO" ]; then a="$a --caso $CASO"; fi
          for r in $REDES; do a="$a --rede $r"; done
          python scripts/collect_casos.py $a > f.txt 2>&1; rc=$?
          while IFS= read -r l; do echo "::notice title=Casos::$(echo "$l" | cut -c1-900)"; done < f.txt
          exit $rc
      - name: Agregados da página
        if: always() && steps.interno.outputs.dir != ''
        continue-on-error: true
        env:
          ODI_INTERNO_DIR: ${{ steps.interno.outputs.dir }}
        run: |
          python scripts/build_casos.py > b.txt 2>&1; rc=$?
          while IFS= read -r l; do echo "::notice title=Casos agregados::$(echo "$l" | cut -c1-600)"; done < b.txt
          exit $rc
      - name: Gravar no repositório privado
        if: always() && steps.interno.outputs.dir != ''
        run: |
          cd "${{ steps.interno.outputs.dir }}"
          git config user.name "odi-atlas-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "Casos (run ${{ github.run_id }})"
          for t in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((t * 10)); done
          exit 1
      - name: Commitar
        if: always()
        run: |
          scripts/commit_push.sh "Casos e análises (run ${{ github.run_id }})"
