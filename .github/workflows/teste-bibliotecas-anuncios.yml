name: Teste — bibliotecas de anúncios Meta e Google (só diagnóstico)

# Verifica o que a Biblioteca de Anúncios da Meta e a Central de Transparência do Google entregam sem login. Não grava nada.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Navegador headless (Playwright) — Meta e Google
        run: |
          pip install -q playwright && python -m playwright install --with-deps chromium > /dev/null 2>&1
          python scripts/diag_bibliotecas_anuncios.py > nav.txt 2>&1 || true
          while IFS= read -r l; do echo "::notice title=Anúncios::$(echo "$l" | cut -c1-1500)"; done < nav.txt
