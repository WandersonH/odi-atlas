name: TSE — pesquisas eleitorais registradas e denúncias do Pardal (dados abertos, grátis)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tse-pesquisas
  cancel-in-progress: false

jobs:
  tse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes
        run: scripts/testes_ci.sh
      - name: Repositório privado
        id: interno
        env:
          TOKEN: ${{ secrets.ODI_INTERNO_TOKEN }}
        run: |
          if [ -n "$TOKEN" ] && git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/WandersonH/odi-atlas-interno.git" "$RUNNER_TEMP/interno"; then
            echo "dir=$RUNNER_TEMP/interno" >> "$GITHUB_OUTPUT"
          fi
      - name: Baixar (bruto no privado; só estrutura no log)
        id: coleta
        continue-on-error: true
        env:
          ODI_INTERNO_DIR: ${{ steps.interno.outputs.dir }}
        run: |
          python scripts/collect_tse_pesquisas.py > "$RUNNER_TEMP/s.txt" 2>&1; rc=$?
          while IFS= read -r l; do echo "::notice title=TSE pesquisas/denúncias::$(echo "$l" | cut -c1-1800)"; done < "$RUNNER_TEMP/s.txt"
          exit $rc
      - name: Gravar no repositório privado
        if: always() && steps.interno.outputs.dir != ''
        run: |
          cd "${{ steps.interno.outputs.dir }}"
          git config user.name "odi-atlas-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "TSE: pesquisas registradas e denúncias do Pardal (run ${{ github.run_id }})"
          for t in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((t * 10)); done
          exit 1
      - name: Commitar
        if: always()
        run: |
          scripts/commit_push.sh "TSE pesquisas e denúncias (run ${{ github.run_id }})"
