name: Teste — preços de atores da Apify (só leitura da loja pública)

on:
  workflow_dispatch:
    inputs:
      busca:
        description: "Termo de busca na loja"
        default: "facebook ads library"

permissions:
  contents: read

jobs:
  loja:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Loja Apify (API pública)
        env:
          BUSCA: ${{ github.event.inputs.busca }}
        run: |
          curl -s "https://api.apify.com/v2/store?limit=15&search=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["BUSCA"]))')" > s.json
          python3 - <<'PY'
          import json
          for x in json.load(open("s.json"))["data"]["items"]:
              p = x.get("currentPricingInfo") or {}
              ev = ((p.get("pricingPerEvent") or {}).get("actorChargeEvents") or {})
              evs = "; ".join(f"{k}={v.get('eventPriceUsd')}" for k, v in list(ev.items())[:4])
              st = x.get("stats") or {}
              print(f"::notice title={x['username']}/{x['name']}::modelo {p.get('pricingModel')} · por unidade {p.get('pricePerUnitUsd')} · eventos {evs} · usuários 30d {st.get('totalUsers30Days')} · avaliação {x.get('actorReviewRating')} ({x.get('actorReviewCount')}) · sucesso 30d {(st.get('publicActorRunStats30Days') or {}).get('SUCCEEDED')}/{(st.get('publicActorRunStats30Days') or {}).get('TOTAL')}")
          PY
      - name: Detalhes de atores (README e esquema de entrada; leitura, sem executar)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          for a in azzouzana~meta-facebook-instagram-ads-library hyperbach~meta-ads-library-scraper apify~facebook-ads-scraper; do
            curl -s -H "Authorization: Bearer $APIFY_TOKEN" "https://api.apify.com/v2/acts/$a" > a.json
            b=$(python3 -c "import json;d=json.load(open('a.json'))['data'];print(d.get('defaultRunOptions',{}).get('build','latest'))")
            curl -s -H "Authorization: Bearer $APIFY_TOKEN" "https://api.apify.com/v2/acts/$a/builds/default" > b.json
            python3 - "$a" <<'PY'
          import json, sys, re
          a = sys.argv[1]
          d = json.load(open("a.json")).get("data", {})
          b = json.load(open("b.json")).get("data", {})
          readme = re.sub(r"\s+", " ", (b.get("readme") or d.get("description") or ""))
          campos = [k for k in ("spend", "impressions", "reach", "demographic", "region", "byline", "political", "paid for", "disclaimer") if k in readme.lower()]
          inp = (b.get("inputSchema") or "")
          props = list(json.loads(inp).get("properties", {}).keys()) if inp else []
          print(f"::notice title={a}::entrada: {props[:25]} · README cita: {campos}")
          i = readme.lower().find("spend")
          print(f"::notice title={a} README::{readme[max(0,i-300):i+500] if i>=0 else readme[:600]}")
          PY
          done
