name: Kwai — chapas 13 e 22 (Apify, conta secundária, teto de gasto)

# Ator unfenced-group/kwai-scraper com APIFY_TOKEN_2. Tetos: teste US$ 0,50; diário US$ 0,10; carga histórica US$ 4,50; mensal US$ 5.
on:
  workflow_dispatch:
    inputs:
      teste:
        description: "Carga inicial (vídeos desde 16/08; teto de teste)"
        type: boolean
        default: false
      historico:
        description: "Carga histórica completa (todo o acervo, com capas; teto US$ 4,50)"
        type: boolean
        default: false
  schedule:
    - cron: "10 13 * * *"   # todo dia, 10h10 em Brasília

concurrency:
  group: kwai
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  kwai:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes
        run: python -m unittest tests.test_kwai
      - name: Repositório privado (se o segredo existir)
        id: interno
        env:
          TOKEN: ${{ secrets.ODI_INTERNO_TOKEN }}
        run: |
          if [ -n "$TOKEN" ] && git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/WandersonH/odi-atlas-interno.git" "$RUNNER_TEMP/interno"; then
            echo "dir=$RUNNER_TEMP/interno" >> "$GITHUB_OUTPUT"
          fi
      - name: Coletar (Apify, com teto)
        id: coleta
        continue-on-error: true
        env:
          APIFY_TOKEN_2: ${{ secrets.APIFY_TOKEN_2 }}
          APIFY_TOKEN_3: ${{ secrets.APIFY_TOKEN_3 }}
          APIFY_TOKEN_4: ${{ secrets.APIFY_TOKEN_4 }}
          APIFY_TOKEN_5: ${{ secrets.APIFY_TOKEN_5 }}
          APIFY_TOKEN_6: ${{ secrets.APIFY_TOKEN_6 }}
          APIFY_TOKEN_7: ${{ secrets.APIFY_TOKEN_7 }}
          ODI_INTERNO_DIR: ${{ steps.interno.outputs.dir }}
          TESTE: ${{ github.event.inputs.teste }}
          HISTORICO: ${{ github.event.inputs.historico }}
        run: |
          if [ "$HISTORICO" = "true" ]; then a="--historico"; elif [ "$TESTE" = "true" ]; then a="--teste"; else a=""; fi
          python scripts/collect_kwai_apify.py $a > k.txt 2>&1; rc=$?
          while IFS= read -r l; do echo "::notice title=Kwai::$(echo "$l" | cut -c1-900)"; done < k.txt
          exit $rc
      - name: Miniaturas (capas; a URL da CDN expira, por isso logo após a coleta)
        if: always()
        continue-on-error: true
        run: |
          pip install -q pillow==11.3.0
          python scripts/build_miniaturas_kwai.py > m.txt 2>&1; rc=$?
          while IFS= read -r l; do echo "::notice title=Kwai miniaturas::$(echo "$l" | cut -c1-400)"; done < m.txt
          exit $rc
      - name: Conteúdo por tema (mesmas regras do TikTok)
        if: always()
        continue-on-error: true
        run: |
          pip install -q networkx==3.6.1 numpy==2.3.4
          rc=0
          { python scripts/build_tiktok.py --kwai && python scripts/corpus_populismo.py --plataforma kwai && python scripts/chd_reinert.py --plataforma kwai \
            && python scripts/concordancia.py --plataforma kwai && python scripts/build_rede.py --plataforma kwai && python scripts/build_rede_mencoes_tiktok.py --kwai; } > b.txt 2>&1 || rc=$?
          grep -v RuntimeWarning b.txt | grep -v "attraction =" | while IFS= read -r l; do echo "::notice title=Kwai análises::$(echo "$l" | cut -c1-400)"; done
          exit $rc
      - name: Gravar bruto no repositório privado
        if: steps.interno.outputs.dir != ''
        run: |
          mkdir -p "${{ steps.interno.outputs.dir }}/kwai/banco"
          cp data/kwai/videos.csv.gz data/kwai/perfis.csv "${{ steps.interno.outputs.dir }}/kwai/banco/"
          cd "${{ steps.interno.outputs.dir }}"
          git config user.name "odi-atlas-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "Kwai (run ${{ github.run_id }})"
          for t in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((t * 10)); done
          exit 1
      - name: Commitar
        if: always()
        run: |
          scripts/commit_push.sh "Kwai (run ${{ github.run_id }})"
