name: Rótulo de IA nas campanhas — YouTube (API oficial) e TikTok (página pública), grátis

on:
  workflow_dispatch:
    inputs:
      tiktok:
        description: "ler também o TikTok (página pública dos perfis)"
        type: boolean
        default: true
  schedule:
    - cron: "47 13 * * *"   # todo dia, 10h47 em Brasília

permissions:
  contents: write

concurrency:
  group: rotulo-ia
  cancel-in-progress: false

jobs:
  rotulo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: |
          pip install -q playwright pillow
          python -m playwright install --with-deps chromium > /dev/null 2>&1
      - name: Testes
        run: scripts/testes_ci.sh
      - name: Repositório privado
        id: interno
        env:
          TOKEN: ${{ secrets.ODI_INTERNO_TOKEN }}
        run: |
          if [ -n "$TOKEN" ] && git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/WandersonH/odi-atlas-interno.git" "$RUNNER_TEMP/interno"; then
            echo "dir=$RUNNER_TEMP/interno" >> "$GITHUB_OUTPUT"
          fi
      - name: Coletar e agregar
        continue-on-error: true
        env:
          ODI_INTERNO_DIR: ${{ steps.interno.outputs.dir }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TIKTOK: ${{ github.event.inputs.tiktok }}
        run: |
          a=""; if [ "$TIKTOK" = "false" ]; then a="--sem-tiktok"; fi
          python scripts/collect_rotulo_ia.py $a > "$RUNNER_TEMP/s.txt" 2>&1; rc=$?
          python scripts/build_rotulo_ia.py . >> "$RUNNER_TEMP/s.txt" 2>&1 || rc=1
          python scripts/collect_imprensa_ia.py >> "$RUNNER_TEMP/s.txt" 2>&1 || rc=1
          tail -n 9 "$RUNNER_TEMP/s.txt" | while IFS= read -r l; do echo "::notice title=Rótulo de IA::$(echo "$l" | cut -c1-400)"; done
          exit $rc
      - name: Gravar no repositório privado
        if: always() && steps.interno.outputs.dir != ''
        run: |
          cd "${{ steps.interno.outputs.dir }}"
          git config user.name "odi-atlas-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "Rótulo de IA: coleta (run ${{ github.run_id }})"
          for t in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((t * 10)); done
          exit 1
      - name: Commitar
        if: always()
        run: |
          scripts/commit_push.sh "Rótulo de IA (run ${{ github.run_id }})"
