name: Casos de busca — Google Trends, YouTube, imprensa e checagens (grátis)

on:
  workflow_dispatch:
    inputs:
      caso:
        description: "id do caso (001, 002, 003, 005, 006, 007, 008, 009, 013, 014, 016, 017, 020, 021, 022, 023, 024, 025, 026, 027, 028, 029, 030, 031 ou 033; vazio = todos)"
        default: ""
      forcar_youtube:
        description: "ler o YouTube de novo mesmo com leitura recente (ex.: depois de mudar o filtro do caso)"
        type: boolean
        default: false
  schedule:
    - cron: "17 8 * * *"   # 02/11/2026: o horário de verão dos EUA acabou em 01/11; a cota do YouTube agora renova às 08h UTC (05h em Brasília)
    # antes:   # 01/11/2026: todo dia, 04h17 em Brasília, logo depois da renovação da cota do YouTube (07h UTC); às 11h53 ela já tinha acabado

permissions:
  contents: write

concurrency:
  group: casos-busca
  cancel-in-progress: false

jobs:
  busca:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: pip install -q networkx==3.6.1 numpy==2.3.4
      - name: Testes
        run: scripts/testes_ci.sh
      - name: Repositório privado
        id: interno
        env:
          TOKEN: ${{ secrets.ODI_INTERNO_TOKEN }}
        run: |
          if [ -n "$TOKEN" ] && git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/WandersonH/odi-atlas-interno.git" "$RUNNER_TEMP/interno"; then
            echo "dir=$RUNNER_TEMP/interno" >> "$GITHUB_OUTPUT"
          fi
      - name: Coletar e agregar
        continue-on-error: true
        env:
          ODI_INTERNO_DIR: ${{ steps.interno.outputs.dir }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FACTCHECK_API_KEY: ${{ secrets.FACTCHECK_API_KEY }}
          CASO: ${{ github.event.inputs.caso }}
        run: |
          rc=0
          FY=""; if [ "${{ github.event.inputs.forcar_youtube }}" = "true" ]; then FY="--forcar-youtube"; fi
          # 02/11/2026: casos ainda sem YouTube primeiro (a cota acabava antes deles); os que já têm leitura recente a reaproveitam
          for c in ${CASO:-021 022 024 025 026 027 028 029 030 031 033 034 035 016 010 011 012 018 019 001 002 003 005 006 007 008 009 013 014 017 020 023}; do
            python scripts/collect_caso_busca.py --caso $c $FY >> "$RUNNER_TEMP/s.txt" 2>&1 || rc=1
            # conversas importadas do Apify (X, Instagram) do caso, quando houver: unifica e agrega antes do build do caso
            case "$c" in 006) python scripts/build_caso_x.py --caso $c >> "$RUNNER_TEMP/s.txt" 2>&1 || rc=1;; esac
            case "$c" in 007|008|009|024) python scripts/build_caso_instagram.py --caso $c >> "$RUNNER_TEMP/s.txt" 2>&1 || rc=1;; esac
            python scripts/build_caso_busca.py --caso $c >> "$RUNNER_TEMP/s.txt" 2>&1 || rc=1
          done
          tail -n 12 "$RUNNER_TEMP/s.txt" | while IFS= read -r l; do echo "::notice title=Casos de busca::$(echo "$l" | cut -c1-400)"; done
          exit $rc
      - name: Gravar no repositório privado
        if: always() && steps.interno.outputs.dir != ''
        run: |
          cd "${{ steps.interno.outputs.dir }}"
          git config user.name "odi-atlas-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "Casos de busca: coleta (run ${{ github.run_id }})"
          for t in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((t * 10)); done
          exit 1
      - name: Commitar
        if: always()
        run: |
          scripts/commit_push.sh "Casos de busca (run ${{ github.run_id }})"
