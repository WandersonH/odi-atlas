name: Casos de busca — Google Trends, YouTube, imprensa e checagens (grátis)

on:
  workflow_dispatch:
    inputs:
      caso:
        description: "id do caso (001, 002, 003, 005, 006, 007, 008, 009, 013, 014, 016, 017, 020, 021, 022, 023, 024, 025, 026, 027, 028, 029, 030, 031, 033, 034, 035, 036 ou 037; vazio = todos)"
        default: ""
      forcar_youtube:
        description: "ler o YouTube de novo mesmo com leitura recente (ex.: depois de mudar o filtro do caso)"
        type: boolean
        default: false
  schedule:
    - cron: "17 8 * * *"   # 02/11/2026: o horário de verão dos EUA acabou em 01/11; a cota do YouTube agora renova às 08h UTC (05h em Brasília)
    # antes:   # 01/11/2026: todo dia, 04h17 em Brasília, logo depois da renovação da cota do YouTube (07h UTC); às 11h53 ela já tinha acabado

permissions:
  contents: write

concurrency:
  group: casos-busca
  cancel-in-progress: false

jobs:
  busca:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # 04/11/2026: com 32 casos a leitura completa passava de 45 min e era cortada (runs 41672525293, 41866360234)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: pip install -q networkx==3.6.1 numpy==2.3.4
      - name: Testes
        run: scripts/testes_ci.sh
      - name: Repositório privado
        id: interno
        env:
          TOKEN: ${{ secrets.ODI_INTERNO_TOKEN }}
        run: |
          if [ -n "$TOKEN" ] && git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/WandersonH/odi-atlas-interno.git" "$RUNNER_TEMP/interno"; then
            echo "dir=$RUNNER_TEMP/interno" >> "$GITHUB_OUTPUT"
          fi
      - name: Coletar e agregar
        continue-on-error: true
        env:
          ODI_INTERNO_DIR: ${{ steps.interno.outputs.dir }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FACTCHECK_API_KEY: ${{ secrets.FACTCHECK_API_KEY }}
          CASO: ${{ github.event.inputs.caso }}
        run: |
          rc=0
          FY=""; if [ "${{ github.event.inputs.forcar_youtube }}" = "true" ]; then FY="--forcar-youtube"; fi
          # 02/11/2026: casos ainda sem YouTube primeiro (a cota acabava antes deles); os que já têm leitura recente a reaproveitam
          # 04/11/2026: sem caso escolhido, vão primeiro os casos com a busca mais antiga (a fila fixa deixava 001–023 sem atualizar quando o tempo ou a cota acabavam)
          LISTA="021 022 024 025 026 027 028 029 030 031 033 034 035 036 037 038 016 010 011 012 018 019 001 002 003 005 006 007 008 009 013 014 017 020 023"
          # 05/11/2026: a ordem passa a ser pela leitura do YouTube mais antiga (arquivo privado), não pela data da busca: em 05/11 a cota
          # acabou no 15º caso e os 15 seguintes (008–033) ficaram com HTTP 429. Depois do primeiro 429, os casos restantes reaproveitam
          # a última leitura do YouTube (YT_INTERVALO_H alto) em vez de gastar tempo com buscas que vão falhar; o resto da coleta segue.
          if [ -z "$CASO" ]; then LISTA=$(python3 -c "
          import json,os,sys
          P=os.environ.get('ODI_INTERNO_DIR') or ''
          def idade(c):
              f=os.path.join(P,'casos',c,'busca_coleta.json')
              try:
                  o=json.load(open(f)); y=o.get('youtube') or {}
                  return (y.get('lido_em') or y.get('reaproveitado_de') or '') if y.get('videos') else ''
              except Exception:
                  return ''
          print(' '.join(sorted(sys.argv[1:],key=idade)))" $LISTA); fi
          echo "ordem: $LISTA"
          COTA=""
          for c in ${CASO:-$LISTA}; do
            YT_INTERVALO_H=${COTA:-48} python scripts/collect_caso_busca.py --caso $c $FY > "$RUNNER_TEMP/caso.txt" 2>&1 || rc=1
            cat "$RUNNER_TEMP/caso.txt" >> "$RUNNER_TEMP/s.txt"
            if [ -z "$COTA" ] && python3 -c "import json,os,sys;o=json.load(open(os.path.join(os.environ['ODI_INTERNO_DIR'],'casos',sys.argv[1],'busca_coleta.json')));sys.exit(0 if any(e.startswith('youtube') and '429' in e for e in o.get('erros',[])) else 1)" $c 2>/dev/null; then COTA=1000000; echo "cota do YouTube acabou no caso $c: os seguintes reaproveitam a última leitura" >> "$RUNNER_TEMP/s.txt"; fi
            # conversas importadas do Apify (X, Instagram) do caso, quando houver: unifica e agrega antes do build do caso
            case "$c" in 006) python scripts/build_caso_x.py --caso $c >> "$RUNNER_TEMP/s.txt" 2>&1 || rc=1;; esac
            case "$c" in 007|008|009|024) python scripts/build_caso_instagram.py --caso $c >> "$RUNNER_TEMP/s.txt" 2>&1 || rc=1;; esac
            python scripts/build_caso_busca.py --caso $c >> "$RUNNER_TEMP/s.txt" 2>&1 || rc=1
          done
          # 07/11/2026 (C19.354): metodologia (universo × amostra dos manifestos) e, no 037, a contagem por língua
          python scripts/build_metodologia.py >> "$RUNNER_TEMP/s.txt" 2>&1 || rc=1
          python scripts/caso_idiomas.py >> "$RUNNER_TEMP/s.txt" 2>&1 || rc=1
          tail -n 12 "$RUNNER_TEMP/s.txt" | while IFS= read -r l; do echo "::notice title=Casos de busca::$(echo "$l" | cut -c1-400)"; done
          exit $rc
      - name: Gravar no repositório privado
        if: always() && steps.interno.outputs.dir != ''
        run: |
          cd "${{ steps.interno.outputs.dir }}"
          git config user.name "odi-atlas-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "Casos de busca: coleta (run ${{ github.run_id }})"
          for t in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((t * 10)); done
          exit 1
      - name: Commitar
        if: always()
        run: |
          scripts/commit_push.sh "Casos de busca (run ${{ github.run_id }})"
