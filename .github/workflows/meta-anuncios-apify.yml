name: Meta — Biblioteca de Anúncios via Apify (teto de gasto)

# Ator jmlp/meta-ad-library-scraper. Tetos autorizados pelo usuário (17/10/2026): teste US$ 0,50; diário US$ 0,30; mensal US$ 9.
# Bruto só no repositório privado; no público, agregados e custo de cada execução.
on:
  workflow_dispatch:
    inputs:
      teste:
        description: "Execução de teste (teto US$ 0,50)"
        type: boolean
        default: false
  schedule:
    - cron: "50 12 * * *"   # todo dia, 09h50 em Brasília

concurrency:
  group: meta-anuncios
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes
        run: python -m unittest tests.test_meta_anuncios tests.test_meta_anuncios_apify
      - name: Repositório privado (se o segredo existir)
        id: interno
        env:
          TOKEN: ${{ secrets.ODI_INTERNO_TOKEN }}
        run: |
          if [ -n "$TOKEN" ] && git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/WandersonH/odi-atlas-interno.git" "$RUNNER_TEMP/interno"; then
            echo "dir=$RUNNER_TEMP/interno" >> "$GITHUB_OUTPUT"
          fi
      - name: Coletar (Apify, com teto)
        id: coleta
        continue-on-error: true
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ODI_INTERNO_DIR: ${{ steps.interno.outputs.dir }}
          TESTE: ${{ github.event.inputs.teste }}
        run: |
          if [ "$TESTE" = "true" ]; then a="--teste"; else a=""; fi
          python scripts/collect_meta_anuncios_apify.py $a > m.txt 2>&1; rc=$?
          while IFS= read -r l; do echo "::notice title=Meta via Apify::$(echo "$l" | cut -c1-900)"; done < m.txt
          exit $rc
      - name: Gravar bruto no repositório privado
        if: steps.interno.outputs.dir != ''
        run: |
          cd "${{ steps.interno.outputs.dir }}"
          git config user.name "odi-atlas-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "Meta anúncios via Apify (run ${{ github.run_id }})"
          for t in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((t * 10)); done
          exit 1
      - name: Commitar (só agregados)
        if: always()
        run: |
          scripts/commit_push.sh "Meta anúncios via Apify: agregados (run ${{ github.run_id }})"
