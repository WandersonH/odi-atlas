name: Google Busca — 5 primeiros e 3 mais recentes por candidato

# Google Programmable Search (Custom Search JSON API). Segredos: GOOGLE_CSE_KEY e GOOGLE_CSE_CX. 4 consultas por execução.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"   # de hora em hora, no minuto 17 (o GitHub pode atrasar alguns minutos)

concurrency:
  group: google-busca
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  busca:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes
        run: python -m unittest tests.test_google_busca
      - name: Onde estão a chave e o cx (só presença, nunca o valor)
        env:
          S_KEY: ${{ secrets.GOOGLE_CSE_KEY }}
          S_CX: ${{ secrets.GOOGLE_CSE_CX }}
          V_KEY: ${{ vars.GOOGLE_CSE_KEY }}
          V_CX: ${{ vars.GOOGLE_CSE_CX }}
          A1: ${{ secrets.GOOGLE_API_KEY }}
          A2: ${{ secrets.GOOGLE_CSE_ID }}
          A3: ${{ secrets.GOOGLE_CX }}
          A4: ${{ secrets.CSE_KEY }}
          A5: ${{ secrets.CSE_CX }}
        run: |
          p(){ [ -n "$1" ] && echo "sim (${#1} caracteres)" || echo "não"; }
          echo "::notice title=Segredos Google::secrets.GOOGLE_CSE_KEY $(p "$S_KEY") · secrets.GOOGLE_CSE_CX $(p "$S_CX") · vars.GOOGLE_CSE_KEY $(p "$V_KEY") · vars.GOOGLE_CSE_CX $(p "$V_CX") · outros nomes: GOOGLE_API_KEY $(p "$A1"), GOOGLE_CSE_ID $(p "$A2"), GOOGLE_CX $(p "$A3"), CSE_KEY $(p "$A4"), CSE_CX $(p "$A5")"
      - name: A chave tem a Custom Search API liberada? (sem cx; só a mensagem de erro do Google)
        env:
          K: ${{ secrets.GOOGLE_CSE_KEY || secrets.YOUTUBE_API_KEY }}
        run: |
          r=$(curl -s "https://customsearch.googleapis.com/customsearch/v1?q=teste&key=$K" | python3 -c "import json,sys;e=json.load(sys.stdin).get('error',{});print(e.get('code'),e.get('status'),(e.get('message') or '')[:300])" || true)
          echo "::notice title=Custom Search · teste da chave::$r"
      - name: Consultar o Google
        id: busca
        continue-on-error: true
        env:
          GOOGLE_CSE_KEY: ${{ secrets.GOOGLE_CSE_KEY || vars.GOOGLE_CSE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX || vars.GOOGLE_CSE_CX }}
        run: python scripts/collect_google_busca.py
      - name: Resumo
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          d = json.loads(pathlib.Path("data/trends/google_busca.json").read_text(encoding="utf-8"))
          print(f"::notice title=Google Busca::{d.get('status')} · erros {d.get('erros')}")
          for c in d.get("candidatos", {}).values():
              print(f"::notice title=Google Busca · {c['nome']}::primeiros: " + " | ".join(r['dominio'] for r in c['primeiros']) + " · recentes: " + " | ".join(r['dominio'] for r in c['recentes']))
          PY
      - name: Commitar
        if: always()
        run: |
          scripts/commit_push.sh "Google Busca: coleta (run ${{ github.run_id }})"
