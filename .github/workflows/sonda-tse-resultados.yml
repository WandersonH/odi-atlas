name: Sonda — arquivos da divulgação do TSE (sem gravar nada)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/collect_resultados_2t.py --sonda-mun 2>&1 | while IFS= read -r l; do echo "::notice title=Sonda TSE::$(echo "$l" | cut -c1-900)"; done
