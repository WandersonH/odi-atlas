name: Totais informados pelas plataformas para os termos de um caso (universo informado)

# Pedido do responsável (28/10/2026, 01h29). Instagram pela conta 1 (teto US$ 0,10); TikTok e YouTube grátis.
on:
  workflow_dispatch:
    inputs:
      caso:
        description: "id do caso"
        default: "014"

permissions:
  contents: write

jobs:
  contagens:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium > /dev/null 2>&1
      - name: Contar
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python scripts/contagens_plataforma.py --caso "${{ inputs.caso }}" > s.txt 2>&1; rc=$?
          while IFS= read -r l; do echo "::notice title=Contagens::$(echo "$l" | cut -c1-900)"; done < s.txt
          exit $rc
      - name: Gravar
        run: |
          scripts/commit_push.sh "Totais das plataformas, caso ${{ inputs.caso }} (run ${{ github.run_id }})"
