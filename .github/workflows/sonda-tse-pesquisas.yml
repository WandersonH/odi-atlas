name: Sonda — estrutura dos dados do TSE (Pardal, pesquisas 2026) e PollingData

on:
  workflow_dispatch:
    inputs:
      args:
        description: "--so-pd para sondar só o PollingData"
        default: ""

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sonda
        run: |
          python scripts/sonda_tse_pesquisas.py ${{ inputs.args }} > s.txt 2>&1
          tail -n 3 s.txt | while IFS= read -r l; do echo "::notice title=Sonda::$(echo "$l" | cut -c1-3500)"; done
      - name: Gravar no repositório privado
        env:
          TOKEN: ${{ secrets.ODI_INTERNO_TOKEN }}
        run: |
          git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/WandersonH/odi-atlas-interno.git" "$RUNNER_TEMP/interno"
          mkdir -p "$RUNNER_TEMP/interno/sondas" && cp s.txt "$RUNNER_TEMP/interno/sondas/tse_pesquisas_denuncias.txt"
          cd "$RUNNER_TEMP/interno"
          git config user.name "odi-atlas-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A; git diff --cached --quiet || git commit -q -m "Sonda TSE pesquisas/denúncias (run ${{ github.run_id }})"
          for t in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((t * 10)); done
