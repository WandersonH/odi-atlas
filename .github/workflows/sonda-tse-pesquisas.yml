name: Sonda — estrutura dos dados do TSE (Pardal, pesquisas 2026) e PollingData

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sonda
        run: |
          python scripts/sonda_tse_pesquisas.py > s.txt 2>&1
          while IFS= read -r l; do echo "::notice title=Sonda::$(echo "$l" | cut -c1-3500)"; done < s.txt
