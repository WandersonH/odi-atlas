name: Kwai — comentários (Apify, APIFY_TOKEN_3, teto US$ 4)

# Ator natanielsantos/kwai-scraper. Teto total autorizado: US$ 5 (data/config/kwai_comentarios.json), teste US$ 0,10.
# Texto e autor dos comentários só no repositório privado; no público, só agregados.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "teste (2 vídeos × 5) · videos-lula (vídeos de @Lulaoficial) · carga (cota por candidato)"
        type: choice
        options: [teste, videos-lula, carga, teste-nataniel, carga-nataniel]
        default: teste

concurrency:
  group: kwai-comentarios
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  comentarios:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: pip install -q networkx==3.6.1 numpy==2.3.4
      - name: Testes
        run: scripts/testes_ci.sh
      - name: Repositório privado
        id: interno
        env:
          TOKEN: ${{ secrets.ODI_INTERNO_TOKEN }}
        run: |
          if [ -n "$TOKEN" ] && git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/WandersonH/odi-atlas-interno.git" "$RUNNER_TEMP/interno"; then
            echo "dir=$RUNNER_TEMP/interno" >> "$GITHUB_OUTPUT"
          fi
      - name: Coletar (Apify, com teto)
        continue-on-error: true
        env:
          APIFY_TOKEN_2: ${{ secrets.APIFY_TOKEN_2 }}
          APIFY_TOKEN_3: ${{ secrets.APIFY_TOKEN_3 }}
          APIFY_TOKEN_4: ${{ secrets.APIFY_TOKEN_4 }}
          APIFY_TOKEN_5: ${{ secrets.APIFY_TOKEN_5 }}
          APIFY_TOKEN_6: ${{ secrets.APIFY_TOKEN_6 }}
          APIFY_TOKEN_7: ${{ secrets.APIFY_TOKEN_7 }}
          ODI_INTERNO_DIR: ${{ steps.interno.outputs.dir }}
          MODO: ${{ github.event.inputs.modo }}
        run: |
          case "$MODO" in teste) a="--teste";; videos-lula) a="--videos-lula";; teste-nataniel) a="--teste --nataniel";; carga-nataniel) a="--nataniel";; *) a="";; esac
          python scripts/collect_comentarios_kwai.py $a > k.txt 2>&1; rc=$?
          while IFS= read -r l; do echo "::notice title=Kwai comentários::$(echo "$l" | cut -c1-900)"; done < k.txt
          exit $rc
      - name: Vídeos novos no acervo do Kwai — capas, temas e análises
        if: always() && github.event.inputs.modo == 'videos-lula'
        continue-on-error: true
        run: |
          pip install -q pillow==11.3.0
          rc=0
          { python scripts/build_miniaturas_kwai.py && python scripts/build_tiktok.py --kwai && python scripts/corpus_populismo.py --plataforma kwai \
            && python scripts/chd_reinert.py --plataforma kwai && python scripts/concordancia.py --plataforma kwai && python scripts/build_rede.py --plataforma kwai \
            && python scripts/build_rede_mencoes_tiktok.py --kwai; } > v.txt 2>&1 || rc=$?
          grep -v "RuntimeWarning\|attraction =" v.txt | while IFS= read -r l; do echo "::notice title=Kwai vídeos::$(echo "$l" | cut -c1-400)"; done
          exit $rc
      - name: Análise (mesmas regras do YouTube; só agregados no público)
        if: always() && steps.interno.outputs.dir != '' && github.event.inputs.modo != 'videos-lula'
        continue-on-error: true
        env:
          ODI_INTERNO_DIR: ${{ steps.interno.outputs.dir }}
        run: |
          rc=0
          { python scripts/build_comentarios.py --plataforma kwai && python scripts/build_rede_comentarios.py --plataforma kwai; } > a.txt 2>&1 || rc=$?
          grep -v "RuntimeWarning\|attraction =" a.txt | while IFS= read -r l; do echo "::notice title=Kwai análise::$(echo "$l" | cut -c1-500)"; done
          exit $rc
      - name: Gravar no repositório privado
        if: always() && steps.interno.outputs.dir != ''
        run: |
          cd "${{ steps.interno.outputs.dir }}"
          git config user.name "odi-atlas-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "Kwai comentários (run ${{ github.run_id }})"
          for t in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((t * 10)); done
          exit 1
      - name: Commitar
        if: always()
        run: |
          scripts/commit_push.sh "Kwai comentários (run ${{ github.run_id }})"
