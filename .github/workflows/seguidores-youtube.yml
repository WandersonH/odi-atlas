name: Seguidores YouTube — API oficial

# Inscritos dos canais do YouTube declarados ao TSE pelas chapas presidenciais.
# Chave só pelo segredo YOUTUBE_API_KEY. Gratuito (cota diária da API).
on:
  workflow_dispatch:
  schedule:
    - cron: "20 10 * * *"   # todo dia, 07h20 em Brasília (com a busca de influenciadores)
    - cron: "20 16,22,4 * * *"  # e 13h20, 19h20 e 01h20: só canais e vídeos (≈157 unidades de cota por leitura, de 10.000/dia)

concurrency:
  group: seguidores-youtube
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências da rede (versões fixas)
        run: pip install networkx==3.6.1 numpy==2.3.4
      - name: Testes
        run: scripts/testes_ci.sh
      - name: Coletar inscritos (YouTube Data API)
        id: coleta
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/collect_youtube.py
      - name: Fichas de YouTube (páginas Panorama, Quem acompanha e Eleitorado e território) — API oficial
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/build_youtube_fichas.py
      - name: Vídeos que saíram do ar (fotos diárias + conferência na API, 1 unidade a cada 50)
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/build_retirados_youtube.py
      - name: Caderno 02 — classificar vídeos por tema
        if: steps.coleta.outcome == 'success'
        continue-on-error: true
        run: python scripts/build_conteudo.py
      - name: Caderno 02 — livro de códigos (pré-codificação), corpus IRaMuTeQ, CHD de Reinert e concordância
        if: steps.coleta.outcome == 'success'
        continue-on-error: true
        run: |
          python scripts/corpus_populismo.py
          python scripts/chd_reinert.py
          python scripts/concordancia.py
      - name: Caderno 02 — rede de coocorrência (JSON, GEXF e planilhas)
        if: steps.coleta.outcome == 'success'
        continue-on-error: true
        run: python scripts/build_rede.py
      - name: Caderno 02 — influenciadores que citam Lula ou Flávio (busca do YouTube, teto de cota)
        id: influ
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '20 10 * * *'
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/collect_influenciadores.py
      - name: Caderno 02 — rede de influenciadores (JSON, GEXF e planilhas)
        if: hashFiles('data/youtube/influenciadores/videos.csv.gz') != ''
        continue-on-error: true
        run: python scripts/build_rede_influenciadores.py

      - name: Resumo
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("data/seguidores/youtube_manifesto_latest.json")
          if not p.exists(): print("## manifesto não gerado"); raise SystemExit
          m = json.loads(p.read_text(encoding="utf-8"))
          print(f"## YouTube — status: **{m['status']}** · canais com número: {m.get('linhas_csv')} de {m.get('alvos')} · vídeos desde {m.get('videos_desde')}: {m.get('videos')} · cota usada: {m.get('cota_usada')}\n")
          for c in m["canais"]: print(f"- {c['url']} → {c.get('titulo') or 'não encontrado'} · {c.get('inscritos') or ('oculto' if c.get('oculto') else '—')}")
          for b in m["blocked"]: print(f"- ⛔ {b}")
          EOF
      - name: Variação de seguidores (última coleta × anterior)
        if: always()
        continue-on-error: true
        run: python scripts/build_variacao_seguidores.py
      - name: Commitar
        if: always()
        run: |
          scripts/commit_push.sh "Seguidores YouTube: coleta (run ${{ github.run_id }})"
      - name: Falhar se houve bloqueio
        if: steps.coleta.outcome == 'failure'
        run: |
          echo "::error::Coleta do YouTube bloqueada — ver data/seguidores/youtube_manifesto_latest.json"
          exit 1
