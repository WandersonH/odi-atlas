name: Teste — posicionamento sem treino (modelo aberto, sem custo)

# Amostra de comentários (YouTube) e respostas (X); classificação favor/contra/neutro sobre Lula e Flávio.
# Roda aqui mesmo (CPU), nenhum texto sai para serviço externo. Texto e previsões só no repositório privado.
on:
  workflow_dispatch:
    inputs:
      versao:
        description: "v1 (hipóteses sobre os dois candidatos) · v2 (contexto + posição sobre o dono do conteúdo)"
        type: choice
        options: [v2, v1]
        default: v2

permissions:
  contents: write

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências (PyTorch só CPU)
        run: |
          pip install -q torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers==5.20.0 sentencepiece==0.2.0 protobuf==5.29.3
      - name: Modelo em cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-mdeberta-xnli-2mil7-v1
      - name: Repositório privado
        id: interno
        env:
          TOKEN: ${{ secrets.ODI_INTERNO_TOKEN }}
        run: |
          git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/WandersonH/odi-atlas-interno.git" "$RUNNER_TEMP/interno"
          echo "dir=$RUNNER_TEMP/interno" >> "$GITHUB_OUTPUT"
      - name: Classificar a amostra
        env:
          ODI_INTERNO_DIR: ${{ steps.interno.outputs.dir }}
        run: |
          if [ "${{ github.event.inputs.versao }}" = "v1" ]; then a=""; else a="--v2"; fi
          python -u scripts/teste_posicao.py $a | tee p.txt
          while IFS= read -r l; do echo "::notice title=Posição (teste)::$(echo "$l" | cut -c1-600)"; done < p.txt
      - name: Gravar no repositório privado
        if: always()
        run: |
          cd "${{ steps.interno.outputs.dir }}"
          git config user.name "odi-atlas-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "Teste de posicionamento (run ${{ github.run_id }})"
          git pull -q --rebase origin main && git push -q origin HEAD:main
      - name: Commitar (só distribuição)
        if: always()
        run: |
          scripts/commit_push.sh "Teste de posicionamento: distribuição (run ${{ github.run_id }})"
