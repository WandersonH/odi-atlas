name: Sonda — TSE 2026, conjuntos ainda não incorporados (estrutura)

# 02/11/2026: auditoria da urna (correspondências, boletim de urna, arquivos transmitidos, logs), comparecimento por perfil e
# perfil do eleitorado. Só estrutura: colunas, linhas e tamanhos. Grátis; não grava nada.
on:
  workflow_dispatch:
    inputs:
      limite_mb:
        default: "120"

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/sonda_tse_auditoria.py "${{ github.event.inputs.limite_mb }}"
