name: Transcrever a fala do vídeo de um caso (faster-whisper, grátis)

# Pedido do responsável em 01/11/2026, 17h23 (caso 024: primeiro vídeo de Flávio Bolsonaro nos EUA).
on:
  workflow_dispatch:
    inputs:
      caso:
        description: "id do caso"
        default: "024"
      modelo:
        description: "modelo do Whisper (small, medium, large-v3)"
        default: "medium"

concurrency:
  group: transcrever-caso
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  transcrever:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          pip install -q faster-whisper==1.1.1
          python -c "import faster_whisper; print('faster-whisper', faster_whisper.__version__)" 2>&1 | tail -n 3 | while IFS= read -r l; do echo "::warning title=Importação::$l"; done
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ inputs.modelo }}-v1
      - name: Repositório privado
        id: interno
        env:
          TOKEN: ${{ secrets.ODI_INTERNO_TOKEN }}
        run: |
          git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/WandersonH/odi-atlas-interno.git" "$RUNNER_TEMP/interno"
          echo "dir=$RUNNER_TEMP/interno" >> "$GITHUB_OUTPUT"
      - name: Baixar a mídia (links do CDN da coleta) e transcrever
        env:
          ODI_INTERNO_DIR: ${{ steps.interno.outputs.dir }}
        run: |
          python scripts/arquivar_midia_caso.py --caso "${{ inputs.caso }}" > t.txt 2>&1 || true
          rc=0; python scripts/transcrever_midia_caso.py --caso "${{ inputs.caso }}" --modelo "${{ inputs.modelo }}" >> t.txt 2>&1 || rc=$?  # o bash do Actions roda com -e: sem "||" a saída nunca era lida
          grep -v "^ *$" t.txt | tr '\r' '\n' | grep -v "^ *$" | tail -n 4 | while IFS= read -r l; do echo "::warning title=Transcrição::$(echo "$l" | cut -c1-300)"; done
          exit $rc
      - name: Gravar no repositório privado (sem o vídeo, que passa de 100 MB)
        if: always()
        run: |
          cd "${{ steps.interno.outputs.dir }}"
          git config user.name "odi-atlas-bot"; git config user.email "actions@users.noreply.github.com"
          v="casos/${{ inputs.caso }}/midia/video.mp4"
          if [ -f "$v" ] && [ "$(stat -c%s "$v")" -gt 95000000 ]; then echo "vídeo de $(stat -c%s "$v") bytes fica fora do git (limite do GitHub)"; echo "$v" >> .git/info/exclude; fi
          git add -A casos
          git diff --cached --quiet || git commit -q -m "Caso ${{ inputs.caso }}: mídia e transcrição (run ${{ github.run_id }})"
          for t in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((t * 10)); done
          exit 1
      - name: Commitar
        if: always()
        run: |
          scripts/commit_push.sh "Caso ${{ inputs.caso }}: transcrição (run ${{ github.run_id }})"
