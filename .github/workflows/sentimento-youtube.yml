name: Sentimento dos comentários do YouTube

# Polaridade (positivo/negativo/neutro) dos comentários coletados, por modelo em português (pysentimiento/bertweet-pt-sentiment).
# Lê e grava o cache no repositório privado (ODI_INTERNO_TOKEN); o público recebe só percentuais por candidato, fase e vídeo.
on:
  workflow_dispatch:
  schedule:
    - cron: "40 11 * * *"   # todo dia, 08h40 em Brasília (depois dos comentários das 07h50)

concurrency:
  group: sentimento-youtube
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sentimento:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências (versões fixas, PyTorch só CPU)
        run: |
          pip install -q torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers==5.20.0 emoji==2.16.0
      - name: Testes
        run: scripts/testes_ci.sh
      - name: Modelo em cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bertweet-pt-sentiment-v1
      - name: Repositório privado
        id: interno
        env:
          TOKEN: ${{ secrets.ODI_INTERNO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::ODI_INTERNO_TOKEN ausente: sem comentários para classificar"; exit 1; fi
          git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/WandersonH/odi-atlas-interno.git" "$RUNNER_TEMP/interno"
          echo "dir=$RUNNER_TEMP/interno" >> "$GITHUB_OUTPUT"
      - name: Classificar e agregar
        env:
          ODI_INTERNO_DIR: ${{ steps.interno.outputs.dir }}
        run: |
          python -u scripts/build_sentimento_comentarios.py | tee sent.txt
          while IFS= read -r l; do echo "::notice title=Sentimento::$l"; done < sent.txt
      - name: Gravar cache no repositório privado
        if: always() && steps.interno.outputs.dir != ''
        run: |
          cd "${{ steps.interno.outputs.dir }}"
          git config user.name "odi-atlas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "Sentimento dos comentários (run ${{ github.run_id }})"
          git pull -q --rebase origin main && git push -q origin HEAD:main
      - name: Commitar (só agregados)
        if: always()
        run: |
          scripts/commit_push.sh "Sentimento dos comentários do YouTube: agregados (run ${{ github.run_id }})"
