name: Google Trends — em alta agora (debate do 2º turno, a cada 15 min, grátis)

# Lista "Em alta agora" do Brasil, RSS e curvas de Lula/Flávio/debate. Janela: 24 h antes e 24 h depois do debate de 18/10.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: trends-agora
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  agora:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar
        continue-on-error: true
        run: |
          python scripts/collect_trends_agora.py > f.txt 2>&1; rc=$?
          while IFS= read -r l; do echo "::notice title=Trends agora::$(echo "$l" | cut -c1-900)"; done < f.txt
          exit $rc
      - name: Commitar
        if: always()
        run: |
          scripts/commit_push.sh "Trends em alta agora (run ${{ github.run_id }})"
