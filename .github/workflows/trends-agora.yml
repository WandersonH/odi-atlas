name: Google Trends — em alta agora (debate do 2º turno, a cada 15 min, grátis)

# Lista "Em alta agora" do Brasil, RSS e curvas de Lula/Flávio/debate. Janela: 24 h antes e 24 h depois do debate de 18/10.
on:
  workflow_dispatch:
    inputs:
      uf:
        description: "ler também a lista de cada estado agora"
        type: boolean
        default: false
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: trends-agora
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  agora:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar
        continue-on-error: true
        run: |
          a=""; if [ "${{ github.event.inputs.uf }}" = "true" ]; then a="--uf"; fi
          python scripts/collect_trends_agora.py $a > f.txt 2>&1; rc=$?
          while IFS= read -r l; do echo "::notice title=Trends agora::$(echo "$l" | cut -c1-900)"; done < f.txt
          exit $rc
      - name: Redes de canais e palavras-chave
        if: always()
        continue-on-error: true
        run: |
          pip install -q networkx==3.6.1 numpy==2.3.4
          python scripts/build_rede_debate.py > r.txt 2>&1; rc=$?
          while IFS= read -r l; do echo "::notice title=Redes do debate::$(echo "$l" | cut -c1-400)"; done < r.txt
          exit $rc
      - name: Commitar
        if: always()
        run: |
          scripts/commit_push.sh "Trends em alta agora (run ${{ github.run_id }})"
