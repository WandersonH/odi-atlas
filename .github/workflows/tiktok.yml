name: TikTok — chapas 13 e 22 (yt-dlp, grátis)

# Lê os vídeos públicos dos perfis de TikTok declarados ao TSE pelas chapas 13 e 22 e gera o caderno 02.
# O TikTok bloqueia de forma intermitente IPs de servidor: o coletor tenta de novo e preserva os dados anteriores.
on:
  workflow_dispatch:
  schedule:
    - cron: "35 10 * * *"   # todo dia, 07h35 em Brasília
    - cron: "35 22 * * *"   # e 19h35 (segunda chance no mesmo dia, se a primeira for bloqueada)

concurrency:
  group: tiktok
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tiktok:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências (yt-dlp sempre atualizado — o TikTok muda com frequência; versão registrada no manifesto)
        run: pip install -q -U yt-dlp && pip install -q networkx==3.6.1 numpy==2.3.4
      - name: Testes
        run: scripts/testes_ci.sh
      - name: Coletar TikTok
        id: coleta
        continue-on-error: true
        run: python scripts/collect_tiktok.py
      - name: Seguidores dos perfis declarados (página pública, grátis; Apify contas 3+ só se a página falhar)
        continue-on-error: true
        env:
          APIFY_TOKEN_3: ${{ secrets.APIFY_TOKEN_3 }}
          APIFY_TOKEN_4: ${{ secrets.APIFY_TOKEN_4 }}
          APIFY_TOKEN_5: ${{ secrets.APIFY_TOKEN_5 }}
          APIFY_TOKEN_6: ${{ secrets.APIFY_TOKEN_6 }}
          APIFY_TOKEN_7: ${{ secrets.APIFY_TOKEN_7 }}
          APIFY_TOKEN_8: ${{ secrets.APIFY_TOKEN_8 }}
          APIFY_TOKEN_9: ${{ secrets.APIFY_TOKEN_9 }}
          APIFY_TOKEN_10: ${{ secrets.APIFY_TOKEN_10 }}
          APIFY_TOKEN_11: ${{ secrets.APIFY_TOKEN_11 }}
          APIFY_TOKEN_12: ${{ secrets.APIFY_TOKEN_12 }}
          APIFY_TOKEN_13: ${{ secrets.APIFY_TOKEN_13 }}
          APIFY_TOKEN_14: ${{ secrets.APIFY_TOKEN_14 }}
          APIFY_TOKEN_15: ${{ secrets.APIFY_TOKEN_15 }}
        run: |
          python scripts/collect_seguidores_tiktok.py --gratis > s.txt 2>&1 || python scripts/collect_seguidores_tiktok.py >> s.txt 2>&1; rc=$?
          while IFS= read -r l; do echo "::notice title=TikTok seguidores::$(echo "$l" | cut -c1-300)"; done < s.txt
          python scripts/build_variacao_seguidores.py || true
          exit $rc
      - name: Caderno 02 — classificar por tema
        if: hashFiles('data/tiktok/videos.csv.gz') != ''
        continue-on-error: true
        run: python scripts/build_tiktok.py
      - name: Caderno 02 — livro de códigos, corpus IRaMuTeQ, CHD de Reinert, concordância e rede (mesmas regras do YouTube)
        if: hashFiles('data/tiktok/videos.csv.gz') != ''
        continue-on-error: true
        run: |
          python scripts/corpus_populismo.py --plataforma tiktok
          python scripts/chd_reinert.py --plataforma tiktok
          python scripts/concordancia.py --plataforma tiktok
          python scripts/build_rede.py --plataforma tiktok
          python scripts/build_rede_mencoes_tiktok.py
      - name: Resumo
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("data/tiktok/manifesto_latest.json")
          if not p.exists(): print("## TikTok: manifesto não gerado"); raise SystemExit
          m = json.loads(p.read_text(encoding="utf-8"))
          print(f"## TikTok — status: **{m['status']}** · {m.get('ferramenta')}\n")
          print("| Perfil | Chapa | Status | Tentativas | Vídeos lidos | Desde 16/08 |\n|---|---|---|---|---|---|")
          for x in m["perfis"]:
              print(f"| @{x['perfil']} | {x['candidate_name']} | {x['status']} | {x['tentativas']} | {x['videos_lidos']} | {x['videos_desde_inicio_campanha']} |")
          print(f"\nAcervo: {m.get('videos_acervo')} vídeos")
          for b in m["blocked"]:
              print(f"::warning title=TikTok::{b}")
          PY
      - name: Commitar
        if: always()
        run: |
          scripts/commit_push.sh "TikTok: coleta (run ${{ github.run_id }})"
      - name: Falhar se todos os perfis bloquearam
        if: steps.coleta.outcome == 'failure'
        run: |
          echo "::error::TikTok bloqueado em todos os perfis — ver data/tiktok/manifesto_latest.json"
          exit 1
