name: Redes no Gephi Toolkit — Modularity, ForceAtlas 2, OpenOrd (grátis)

# 07/11/2026 (C19.357): os mesmos algoritmos do Gephi sem interface, para as redes dos casos. Saída em data/redes/gephi/.
on:
  workflow_dispatch:
    inputs:
      redes:
        description: "GEXF a processar, separados por espaço (ex.: data/casos/026/rede_circulacao.gexf), ou um padrão glob"
        required: true
        default: "data/casos/026/rede_circulacao.gexf data/casos/026/rede_respostas_comentarios.gexf data/casos/026/rede.gexf"

permissions:
  contents: write

concurrency:
  group: redes-gephi
  cancel-in-progress: false

jobs:
  gephi:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gephi Toolkit
        run: |
          V=0.10.1
          curl -sSfL -o "$RUNNER_TEMP/gephi-toolkit.jar" "https://repo1.maven.org/maven2/org/gephi/gephi-toolkit/$V/gephi-toolkit-$V-all.jar"
          ls -la "$RUNNER_TEMP/gephi-toolkit.jar"
          mkdir -p "$RUNNER_TEMP/cls" && javac -encoding UTF-8 -cp "$RUNNER_TEMP/gephi-toolkit.jar" -d "$RUNNER_TEMP/cls" scripts/gephi/RedesGephi.java
      - name: Rodar
        run: |
          ARQS=$(ls ${{ github.event.inputs.redes }} 2>/dev/null)
          echo "$ARQS"
          java -Xmx6g -Djava.awt.headless=true -cp "$RUNNER_TEMP/gephi-toolkit.jar:$RUNNER_TEMP/cls" RedesGephi data/redes/gephi $ARQS | tee g.txt
          tail -n 8 g.txt | while IFS= read -r l; do echo "::notice title=Gephi::$(echo "$l" | cut -c1-300)"; done
      - name: Commitar
        if: always()
        run: |
          scripts/commit_push.sh "Redes no Gephi Toolkit (run ${{ github.run_id }})"
