name: Redes no Gephi Toolkit — Modularity, ForceAtlas 2, OpenOrd (grátis)

# 07/11/2026 (C19.357): os mesmos algoritmos do Gephi sem interface, para as redes dos casos. Saída em data/redes/gephi/.
on:
  workflow_dispatch:
    inputs:
      redes:
        description: "GEXF a processar, separados por espaço (ex.: data/casos/026/rede_circulacao.gexf), ou um padrão glob"
        required: true
        default: "data/casos/026/rede_circulacao.gexf data/casos/026/rede_respostas_comentarios.gexf data/casos/026/rede.gexf"

permissions:
  contents: write

concurrency:
  group: redes-gephi
  cancel-in-progress: false

jobs:
  gephi:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gephi Toolkit
        run: |
          V=0.10.1
          curl -sSfL -o "$RUNNER_TEMP/gephi-toolkit.jar" "https://repo1.maven.org/maven2/org/gephi/gephi-toolkit/$V/gephi-toolkit-$V-all.jar"
          ls -la "$RUNNER_TEMP/gephi-toolkit.jar"
          mkdir -p "$RUNNER_TEMP/cls" && javac -encoding UTF-8 -cp "$RUNNER_TEMP/gephi-toolkit.jar" -d "$RUNNER_TEMP/cls" scripts/gephi/RedesGephi.java
      - name: Rodar
        run: |
          ARQS=$(ls ${{ github.event.inputs.redes }} 2>/dev/null)
          # C19.371: casos protegidos (020) só entram com os GEXF já anonimizados (scripts/anonimizar_publico.py); arquivo com ocorrência fica de fora
          python3 scripts/anonimizar_publico.py
          if ! python3 scripts/anonimizar_publico.py --verificar; then
            for p in $(python3 -c "import sys;sys.path.insert(0,'scripts');import anonimizar_publico as a;print(' '.join(a.casos_protegidos()))"); do ARQS=$(echo "$ARQS" | grep -v "data/casos/$p/" || true); done
          fi
          echo "$ARQS"; [ -n "$ARQS" ] || { echo "nada a desenhar"; exit 0; }
          sudo apt-get install -y -qq xvfb >/dev/null 2>&1 || true
          xvfb-run -a -s "-screen 0 1920x1080x24" java -Xmx6g --add-opens java.base/java.net=ALL-UNNAMED --add-opens java.base/java.lang=ALL-UNNAMED -cp "$RUNNER_TEMP/gephi-toolkit.jar:$RUNNER_TEMP/cls" RedesGephi data/redes/gephi $ARQS | tee g.txt
          tail -n 8 g.txt | while IFS= read -r l; do echo "::notice title=Gephi::$(echo "$l" | cut -c1-300)"; done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lado a lado (Mirror/Rotate automáticos) com rótulos só de contas públicas
        run: |
          pip install -q matplotlib==3.10.7 numpy==2.3.4 networkx==3.6.1 adjustText==1.3.0
          for f in ${{ github.event.inputs.redes }}; do c=$(basename $(dirname $f)); r=$(basename $f .gexf); [ -f "data/redes/gephi/${c}_${r}_nos_gephi.csv" ] && python scripts/comparar_layouts.py "data/redes/gephi/${c}_${r}_nos_gephi.csv"; done || true
      - name: Commitar
        if: always()
        run: |
          scripts/commit_push.sh "Redes no Gephi Toolkit (run ${{ github.run_id }})"
