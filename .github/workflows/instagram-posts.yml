name: Instagram — o que as campanhas publicam (Apify, conta 8, teto US$ 5)

# Perfis de Instagram declarados ao TSE pelas chapas 13 e 22, desde 20/07/2026. Ator e teto em data/config/instagram_posts.json.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "teste (10 posts de @lulaoficial) · carga (todos os perfis) · so-analises (sem coleta, sem custo)"
        type: choice
        options: [teste, carga, so-analises]
        default: teste
      ator:
        description: "ator (vazio = o primeiro da config)"
        default: ""

concurrency:
  group: instagram-posts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: pip install -q networkx==3.6.1 numpy==2.3.4
      - name: Testes
        run: scripts/testes_ci.sh
      - name: Repositório privado
        id: interno
        env:
          TOKEN: ${{ secrets.ODI_INTERNO_TOKEN }}
        run: |
          if [ -n "$TOKEN" ] && git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/WandersonH/odi-atlas-interno.git" "$RUNNER_TEMP/interno"; then
            echo "dir=$RUNNER_TEMP/interno" >> "$GITHUB_OUTPUT"
          fi
      - name: Coletar (Apify, com teto)
        if: github.event.inputs.modo != 'so-analises'
        continue-on-error: true
        env:
          APIFY_TOKEN_3: ${{ secrets.APIFY_TOKEN_3 }}
          APIFY_TOKEN_4: ${{ secrets.APIFY_TOKEN_4 }}
          APIFY_TOKEN_5: ${{ secrets.APIFY_TOKEN_5 }}
          APIFY_TOKEN_6: ${{ secrets.APIFY_TOKEN_6 }}
          APIFY_TOKEN_7: ${{ secrets.APIFY_TOKEN_7 }}
          APIFY_TOKEN_8: ${{ secrets.APIFY_TOKEN_8 }}
          APIFY_TOKEN_9: ${{ secrets.APIFY_TOKEN_9 }}
          APIFY_TOKEN_10: ${{ secrets.APIFY_TOKEN_10 }}
          APIFY_TOKEN_11: ${{ secrets.APIFY_TOKEN_11 }}
          APIFY_TOKEN_12: ${{ secrets.APIFY_TOKEN_12 }}
          APIFY_TOKEN_13: ${{ secrets.APIFY_TOKEN_13 }}
          APIFY_TOKEN_14: ${{ secrets.APIFY_TOKEN_14 }}
          APIFY_TOKEN_15: ${{ secrets.APIFY_TOKEN_15 }}
          ODI_INTERNO_DIR: ${{ steps.interno.outputs.dir }}
          MODO: ${{ github.event.inputs.modo }}
          ATOR: ${{ github.event.inputs.ator }}
        run: |
          case "$MODO" in teste) a="--teste";; *) a="";; esac
          if [ -n "$ATOR" ]; then a="$a --ator $ATOR"; fi
          python scripts/collect_instagram_posts.py $a > f.txt 2>&1; rc=$?
          while IFS= read -r l; do echo "::notice title=Instagram::$(echo "$l" | cut -c1-900)"; done < f.txt
          exit $rc
      - name: Gravar a coleta antes das etapas lentas
        if: always()
        run: |
          scripts/commit_push.sh "Instagram: posts (run ${{ github.run_id }})"
      - name: Miniaturas (a URL da capa expira; logo após a coleta)
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: |
          pip install -q pillow==11.3.0
          python scripts/build_miniaturas_kwai.py --instagram > m.txt 2>&1; rc=$?
          while IFS= read -r l; do echo "::notice title=Instagram miniaturas::$(echo "$l" | cut -c1-400)"; done < m.txt
          exit $rc
      - name: Conteúdo por tema e análises (mesmas regras do TikTok e do Kwai)
        if: always()
        continue-on-error: true
        run: |
          rc=0
          { python scripts/build_tiktok.py --instagram && python scripts/corpus_populismo.py --plataforma instagram && python scripts/chd_reinert.py --plataforma instagram \
            && python scripts/concordancia.py --plataforma instagram && python scripts/build_rede.py --plataforma instagram && python scripts/build_rede_mencoes_tiktok.py --instagram; } > b.txt 2>&1 || rc=$?
          grep -v "RuntimeWarning\|attraction =" b.txt | while IFS= read -r l; do echo "::notice title=Instagram análises::$(echo "$l" | cut -c1-400)"; done
          exit $rc
      - name: Variação de seguidores (hoje × ontem)
        if: always()
        continue-on-error: true
        run: python scripts/build_variacao_seguidores.py
      - name: Gravar bruto no repositório privado
        if: always() && steps.interno.outputs.dir != ''
        run: |
          cd "${{ steps.interno.outputs.dir }}"
          git config user.name "odi-atlas-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "Instagram (run ${{ github.run_id }})"
          for t in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((t * 10)); done
          exit 1
      - name: Commitar
        if: always()
        run: |
          scripts/commit_push.sh "Instagram (run ${{ github.run_id }})"
