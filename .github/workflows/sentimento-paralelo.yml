name: Sentimento — YouTube em 4 partes paralelas (para alcançar o acervo completo, grátis)

# A leitura completa trouxe ~890 mil comentários; um run classifica ~36 mil em 75 min. Quatro jobs em paralelo, cada um
# com uma parte dos ids (crc32 % 4), gravam sentimento_parte_K.csv.gz no privado; depois o workflow principal junta e agrega.
on:
  workflow_dispatch:
  schedule:
    - cron: "10 13,1 * * *"   # 10h10 e 22h10 de Brasília, enquanto houver pendentes (o script não faz nada se não houver)

concurrency:
  group: sentimento-paralelo
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  parte:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        k: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências (versões fixas, PyTorch só CPU)
        run: |
          pip install -q torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers==5.20.0 emoji==2.16.0
      - name: Modelo em cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bertweet-pt-sentiment-v1
      - name: Repositório privado
        id: interno
        env:
          TOKEN: ${{ secrets.ODI_INTERNO_TOKEN }}
        run: |
          git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/WandersonH/odi-atlas-interno.git" "$RUNNER_TEMP/interno"
          echo "dir=$RUNNER_TEMP/interno" >> "$GITHUB_OUTPUT"
      - name: Classificar a parte ${{ matrix.k }} de 4
        env:
          ODI_INTERNO_DIR: ${{ steps.interno.outputs.dir }}
        run: |
          python -u scripts/build_sentimento_comentarios.py --parte ${{ matrix.k }}/4 | tail -n 3 | while IFS= read -r l; do echo "::notice title=Sentimento parte ${{ matrix.k }}::$l"; done
      - name: Gravar no privado
        run: |
          cd "${{ steps.interno.outputs.dir }}"
          git config user.name "odi-atlas-bot"; git config user.email "actions@users.noreply.github.com"
          git add youtube/comentarios/sentimento_parte_${{ matrix.k }}.csv.gz 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Sentimento YouTube: parte ${{ matrix.k }}/4 (run ${{ github.run_id }})"
          ok=0; for t in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && { ok=1; break; }; sleep $((t * 15)); done; [ $ok = 1 ]
  juntar:
    needs: parte
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disparar a agregação (workflow principal)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sentimento-youtube.yml && echo "::notice title=Sentimento::agregação disparada"
