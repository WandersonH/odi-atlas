name: Teste — TikTok no navegador (comentários, hashtag, busca; só diagnóstico)

# Verifica se o endpoint público de comentários do TikTok responde a partir do IP do GitHub. Não grava nada.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Navegador headless (Playwright) — comentários, hashtag e busca
        run: |
          pip install -q playwright && python -m playwright install --with-deps chromium > /dev/null 2>&1
          python scripts/diag_tiktok_navegador.py > nav.txt 2>&1 || true
          while IFS= read -r l; do echo "::notice title=TikTok navegador::$(echo "$l" | cut -c1-900)"; done < nav.txt
