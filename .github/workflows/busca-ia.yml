name: Busca de conteúdo de IA (TikTok e Instagram; conta 1, teto US$ 10, uso pontual autorizado)

# data/config/busca_ia.json — autorizado pelo responsável em 23/10/2026 (01h16). A coleta paga respeita o teto do lote
# (soma dos manifestos); a leitura dos rótulos é grátis (navegador sem login). Texto e autores só no repositório privado.
on:
  workflow_dispatch:
    inputs:
      etapa:
        description: "coletar+rotulos (padrão) · rotulos (só a leitura grátis) · build"
        default: "coletar+rotulos"
      limite_tiktok:
        description: "vídeos do TikTok com rótulo a ler nesta execução (vazio = 400)"
        default: ""
      limite_instagram:
        description: "posts do Instagram a ler (vazio = 80)"
        default: ""

permissions:
  contents: write

concurrency:
  group: busca-ia
  cancel-in-progress: false

jobs:
  busca:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium > /dev/null 2>&1
      - name: Repositório privado
        id: interno
        env:
          TOKEN: ${{ secrets.ODI_INTERNO_TOKEN }}
        run: |
          git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/WandersonH/odi-atlas-interno.git" "$RUNNER_TEMP/interno"
          echo "dir=$RUNNER_TEMP/interno" >> "$GITHUB_OUTPUT"
      - name: Buscar e ler rótulos
        env:
          APIFY_TOKEN: ${{ contains(github.event.inputs.etapa, 'coletar') && secrets.APIFY_TOKEN || '' }}
          ODI_INTERNO_DIR: ${{ steps.interno.outputs.dir }}
          ETAPA: ${{ github.event.inputs.etapa }}
        run: |
          a=""
          case "$ETAPA" in *coletar*) a="$a --coletar";; esac
          case "$ETAPA" in *rotulos*) a="$a --rotulos";; esac
          case "$ETAPA" in *build*) a="$a --build";; esac
          if [ -n "${{ github.event.inputs.limite_tiktok }}" ]; then a="$a --limite-tiktok ${{ github.event.inputs.limite_tiktok }}"; fi
          if [ -n "${{ github.event.inputs.limite_instagram }}" ]; then a="$a --limite-instagram ${{ github.event.inputs.limite_instagram }}"; fi
          python scripts/collect_busca_ia.py $a > s.txt 2>&1; rc=$?
          tail -n 30 s.txt | while IFS= read -r l; do echo "::notice title=Busca IA::$(echo "$l" | cut -c1-400)"; done
          exit $rc
      - name: Gravar no repositório privado
        if: always()
        run: |
          cd "${{ steps.interno.outputs.dir }}"
          git config user.name "odi-atlas-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "Busca de IA (run ${{ github.run_id }})"
          for t in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((t * 10)); done
          exit 1
      - name: Commitar
        if: always()
        run: |
          scripts/commit_push.sh "Busca de IA (run ${{ github.run_id }})"
