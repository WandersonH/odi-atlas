name: Resultado do 2º turno — divulgação oficial do TSE (Brasil e UFs, a cada 5 min, grátis)

# Lê os arquivos simplificados de resultados.tse.jus.br (os do app Resultados) e grava em data/tse/segundo_turno/.
# Fica em laço até 5h40 (o agendamento do GitHub atrasa) e para quando o TSE marcar 100% das seções totalizadas.
on:
  workflow_dispatch:
    inputs:
      intervalo:
        description: "minutos entre leituras"
        default: "5"
      sonda:
        description: "só uma leitura, imprimindo as chaves do arquivo"
        type: boolean
        default: false
      sonda_mun:
        description: "só descobrir o arquivo por município"
        type: boolean
        default: false

concurrency:
  group: resultados-2t
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  apuracao:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leituras
        env:
          GH_TOKEN: ${{ github.token }}
          INTERVALO: ${{ github.event.inputs.intervalo }}
        run: |
          if [ "${{ github.event.inputs.sonda_mun }}" = "true" ]; then
            python scripts/collect_resultados_2t.py --sonda-mun 2>&1 | while IFS= read -r l; do echo "::notice title=Sonda municípios::$(echo "$l" | cut -c1-900)"; done; exit 0
          fi
          if [ "${{ github.event.inputs.sonda }}" = "true" ]; then
            python scripts/collect_resultados_2t.py --sonda 2>&1 | while IFS= read -r l; do echo "::notice title=Resultado 2º turno::$(echo "$l" | cut -c1-900)"; done
            scripts/commit_push.sh "Resultado do 2º turno: sonda (run ${{ github.run_id }})"; exit 0
          fi
          limite=$(( $(date -u +%s) + 5*3600 + 40*60 ))
          while [ $(date -u +%s) -lt $limite ]; do
            t0=$(date -u +%s)
            git pull -q --rebase origin main || true
            python scripts/collect_resultados_2t.py > r.txt 2>&1 || true
            echo "::notice title=Resultado 2º turno $(date -u +%H:%M)::$(tail -n 1 r.txt | cut -c1-600)"
            scripts/commit_push.sh "Resultado do 2º turno $(date -u +%H:%M) UTC (run ${{ github.run_id }})" || true
            if python -c "import json,sys;d=json.load(open('data/tse/segundo_turno/resultado.json'));m=json.load(open('data/tse/segundo_turno/municipios.json'))['m'];sys.exit(0 if (d.get('brasil') or {}).get('pct_secoes_totalizadas')==100.0 and all((u or {}).get('pct_secoes_totalizadas')==100.0 for u in d.get('ufs',{}).values()) and all((x.get('pst') or 0)>=100 for x in m.values() if x.get('l') is not None) else 1)" 2>/dev/null; then
              echo "::notice title=Resultado 2º turno::100% das seções totalizadas: fim"; exit 0
            fi
            dt=$(( ${INTERVALO:-5} * 60 - ($(date -u +%s) - t0) )); [ $dt -gt 30 ] && sleep $dt
          done
          gh workflow run resultados-2t.yml -f intervalo="${INTERVALO:-5}" && echo "::notice title=Resultado 2º turno::continua em novo run"
