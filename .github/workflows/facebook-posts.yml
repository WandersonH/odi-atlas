name: Facebook — o que as campanhas publicam (Apify, APIFY_TOKEN_2, teto US$ 5)

# Ator apify/facebook-posts-scraper. Páginas declaradas ao TSE pelas chapas 13 e 22, desde 16/08/2026.
# Teto total autorizado: US$ 5 (data/config/facebook_posts.json); teste US$ 0,10.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "teste (10 posts de facebook.com/lula) · carga (todas as páginas)"
        type: choice
        options: [teste, carga]
        default: teste

concurrency:
  group: facebook-posts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  facebook:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: pip install -q networkx==3.6.1 numpy==2.3.4
      - name: Testes
        run: scripts/testes_ci.sh
      - name: Repositório privado
        id: interno
        env:
          TOKEN: ${{ secrets.ODI_INTERNO_TOKEN }}
        run: |
          if [ -n "$TOKEN" ] && git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/WandersonH/odi-atlas-interno.git" "$RUNNER_TEMP/interno"; then
            echo "dir=$RUNNER_TEMP/interno" >> "$GITHUB_OUTPUT"
          fi
      - name: Coletar (Apify, com teto)
        continue-on-error: true
        env:
          APIFY_TOKEN_2: ${{ secrets.APIFY_TOKEN_2 }}
          ODI_INTERNO_DIR: ${{ steps.interno.outputs.dir }}
          MODO: ${{ github.event.inputs.modo }}
        run: |
          if [ "$MODO" = "teste" ]; then a="--teste"; else a=""; fi
          python scripts/collect_facebook_posts.py $a > f.txt 2>&1; rc=$?
          while IFS= read -r l; do echo "::notice title=Facebook::$(echo "$l" | cut -c1-900)"; done < f.txt
          exit $rc
      - name: Conteúdo por tema e análises (mesmas regras do TikTok e do Kwai)
        if: always()
        continue-on-error: true
        run: |
          rc=0
          { python scripts/build_tiktok.py --facebook && python scripts/corpus_populismo.py --plataforma facebook && python scripts/chd_reinert.py --plataforma facebook \
            && python scripts/concordancia.py --plataforma facebook && python scripts/build_rede.py --plataforma facebook; } > b.txt 2>&1 || rc=$?
          grep -v "RuntimeWarning\|attraction =" b.txt | while IFS= read -r l; do echo "::notice title=Facebook análises::$(echo "$l" | cut -c1-400)"; done
          exit $rc
      - name: Gravar bruto no repositório privado
        if: always() && steps.interno.outputs.dir != ''
        run: |
          cd "${{ steps.interno.outputs.dir }}"
          git config user.name "odi-atlas-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "Facebook (run ${{ github.run_id }})"
          for t in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((t * 10)); done
          exit 1
      - name: Commitar
        if: always()
        run: |
          scripts/commit_push.sh "Facebook (run ${{ github.run_id }})"
