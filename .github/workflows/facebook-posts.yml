name: Facebook — o que as campanhas publicam (Apify; diário na conta 1, teto US$ 0,40/dia e US$ 10/mês)

# Ator apify/facebook-posts-scraper. Páginas declaradas ao TSE pelas chapas 13 e 22, desde 16/08/2026.
# Teto total autorizado: US$ 5 (data/config/facebook_posts.json); teste US$ 0,10.
# Diário (autorizado em 22/10/2026): conta 1 (APIFY_TOKEN), posts desde o dia anterior, US$ 0,40/dia e US$ 10/mês.
on:
  schedule:
    - cron: "20 12 * * *"   # todo dia, 09h20 em Brasília (modo diário)
  workflow_dispatch:
    inputs:
      modo:
        description: "teste (10 posts de facebook.com/lula) · carga (todas as páginas) · so-analises (sem coleta, sem custo)"
        type: choice
        options: [diario, teste, carga, pre-campanha, so-analises]
        default: teste

concurrency:
  group: facebook-posts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  facebook:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: pip install -q networkx==3.6.1 numpy==2.3.4
      - name: Testes
        run: scripts/testes_ci.sh
      - name: Repositório privado
        id: interno
        env:
          TOKEN: ${{ secrets.ODI_INTERNO_TOKEN }}
        run: |
          if [ -n "$TOKEN" ] && git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/WandersonH/odi-atlas-interno.git" "$RUNNER_TEMP/interno"; then
            echo "dir=$RUNNER_TEMP/interno" >> "$GITHUB_OUTPUT"
          fi
      - name: Coletar (Apify, com teto)
        if: github.event.inputs.modo != 'so-analises'
        continue-on-error: true
        env:
          APIFY_TOKEN: ${{ (github.event_name == 'schedule' || github.event.inputs.modo == 'diario') && secrets.APIFY_TOKEN || '' }}
          APIFY_TOKEN_2: ${{ secrets.APIFY_TOKEN_2 }}
          APIFY_TOKEN_3: ${{ secrets.APIFY_TOKEN_3 }}
          APIFY_TOKEN_4: ${{ secrets.APIFY_TOKEN_4 }}
          APIFY_TOKEN_5: ${{ secrets.APIFY_TOKEN_5 }}
          APIFY_TOKEN_6: ${{ secrets.APIFY_TOKEN_6 }}
          APIFY_TOKEN_7: ${{ secrets.APIFY_TOKEN_7 }}
          APIFY_TOKEN_8: ${{ secrets.APIFY_TOKEN_8 }}
          APIFY_TOKEN_9: ${{ secrets.APIFY_TOKEN_9 }}
          APIFY_TOKEN_10: ${{ secrets.APIFY_TOKEN_10 }}
          APIFY_TOKEN_11: ${{ secrets.APIFY_TOKEN_11 }}
          APIFY_TOKEN_12: ${{ secrets.APIFY_TOKEN_12 }}
          APIFY_TOKEN_13: ${{ secrets.APIFY_TOKEN_13 }}
          APIFY_TOKEN_14: ${{ secrets.APIFY_TOKEN_14 }}
          APIFY_TOKEN_15: ${{ secrets.APIFY_TOKEN_15 }}
          ODI_INTERNO_DIR: ${{ steps.interno.outputs.dir }}
          MODO: ${{ github.event_name == 'schedule' && 'diario' || github.event.inputs.modo }}
        run: |
          case "$MODO" in diario) a="--diario";; teste) a="--teste";; pre-campanha) a="--pre";; carga) a="";; *) echo "modo desconhecido: $MODO"; exit 1;; esac
          python scripts/collect_facebook_posts.py $a > f.txt 2>&1; rc=$?
          while IFS= read -r l; do echo "::notice title=Facebook::$(echo "$l" | cut -c1-900)"; done < f.txt
          exit $rc
      - name: Miniaturas (a URL da capa expira; logo após a coleta)
        if: always()
        continue-on-error: true
        run: |
          pip install -q pillow==11.3.0
          python scripts/build_miniaturas_kwai.py --facebook > m.txt 2>&1; rc=$?
          while IFS= read -r l; do echo "::notice title=Facebook miniaturas::$(echo "$l" | cut -c1-400)"; done < m.txt
          exit $rc
      - name: Conteúdo por tema e análises (mesmas regras do TikTok e do Kwai)
        if: always()
        continue-on-error: true
        run: |
          rc=0
          { python scripts/build_tiktok.py --facebook && python scripts/corpus_populismo.py --plataforma facebook && python scripts/chd_reinert.py --plataforma facebook \
            && python scripts/concordancia.py --plataforma facebook && python scripts/build_rede.py --plataforma facebook && python scripts/build_rede_mencoes_tiktok.py --facebook; } > b.txt 2>&1 || rc=$?
          grep -v "RuntimeWarning\|attraction =" b.txt | while IFS= read -r l; do echo "::notice title=Facebook análises::$(echo "$l" | cut -c1-400)"; done
          exit $rc
      - name: Gravar bruto no repositório privado
        if: always() && steps.interno.outputs.dir != ''
        run: |
          cd "${{ steps.interno.outputs.dir }}"
          git config user.name "odi-atlas-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "Facebook (run ${{ github.run_id }})"
          for t in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((t * 10)); done
          exit 1
      - name: Commitar
        if: always()
        run: |
          scripts/commit_push.sh "Facebook (run ${{ github.run_id }})"
