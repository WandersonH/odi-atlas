name: Teste — Kwai no navegador (perfis declarados ao TSE; só diagnóstico)

# Versão 2026 (Playwright, sem login, só metadados) da ideia do kwai-video-scraper. Não grava nada.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Navegador headless (Playwright) — Kwai
        run: |
          pip install -q playwright && python -m playwright install --with-deps chromium > /dev/null 2>&1
          python scripts/diag_kwai.py > nav.txt 2>&1 || true
          while IFS= read -r l; do echo "::notice title=Kwai::$(echo "$l" | cut -c1-1500)"; done < nav.txt
